spring.application.name=audit-log-service

# Production database settings must be supplied through environment variables
spring.datasource.url=${AUDIT_DATABASE_URL}
spring.datasource.username=${AUDIT_DATABASE_USERNAME}
spring.datasource.password=${AUDIT_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false






spring.jackson.factory.constraints.read.max-nesting-depth=32


# Audit event retention period in days
audit.retention.days=365
audit.redaction.key-id=${AUDIT_REDACTION_KEY_ID:legacy-v1}
audit.redaction.keys.legacy-v1=${AUDIT_REDACTION_HMAC_KEY_BASE64}

audit.security.admin.username=${AUDIT_API_USERNAME}
audit.security.admin.password=${AUDIT_API_PASSWORD}
audit.security.reader.username=${AUDIT_READER_USERNAME}
audit.security.reader.password=${AUDIT_READER_PASSWORD}
audit.security.reader.resource-ids=${AUDIT_READER_RESOURCE_IDS}

# Per-admin event creation rate limit
audit.rate-limit.create.max-requests=10
audit.rate-limit.create.window-seconds=60
