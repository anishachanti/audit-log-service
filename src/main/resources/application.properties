spring.application.name=audit-log-service

# H2 file-based database
# spring.datasource.url=jdbc:h2:file:./data/auditdb_demo;DB_CLOSE_ON_EXIT=FALSE

spring.datasource.url=jdbc:h2:file:./data/auditdb_redaction;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create/update the database schema
spring.jpa.hibernate.ddl-auto=update

# Display SQL statements in the console while developing
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Audit event retention period in days
audit.retention.days=365
audit.redaction.hmac-key-base64=${AUDIT_REDACTION_HMAC_KEY_BASE64}

audit.security.admin.username=${AUDIT_API_USERNAME}
audit.security.admin.password=${AUDIT_API_PASSWORD}
audit.security.reader.username=${AUDIT_READER_USERNAME}
audit.security.reader.password=${AUDIT_READER_PASSWORD}
audit.security.reader.resource-ids=${AUDIT_READER_RESOURCE_IDS}