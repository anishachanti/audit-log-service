spring.datasource.url=jdbc:h2:mem:audit_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jackson.factory.constraints.read.max-nesting-depth=32


audit.security.admin.username=audit-test-admin
audit.security.admin.password=test-only-admin-password
audit.security.reader.username=audit-test-reader
audit.security.reader.password=test-only-reader-password
audit.security.reader.resource-ids=security-test-1,resource-export-account

# Per-admin event creation rate limit
audit.rate-limit.create.max-requests=10
audit.rate-limit.create.window-seconds=60
audit.redaction.key-id=legacy-v1
audit.redaction.keys.legacy-v1=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU2Nzg=
